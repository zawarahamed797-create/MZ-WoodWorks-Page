<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bachat Store</title>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f5f7fb;
    }

    header {
        background: #0057ff;
        color: white;
        padding: 15px;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    header h1 {
        margin: 0;
    }

    .cart {
        background: #ffcc00;
        color: black;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
    }

    .hero {
        background: linear-gradient(to right, #0057ff, #00b3ff);
        color: white;
        text-align: center;
        padding: 40px 20px;
    }

    .products {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
        padding: 20px;
    }

    .product {
        background: white;
        padding: 15px;
        border-radius: 10px;
        box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        text-align: center;
    }

    .product button {
        background: #0057ff;
        color: white;
        border: none;
        padding: 8px 10px;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 10px;
    }

    .product button:hover {
        background: #003ecc;
    }

    footer {
        background: #222;
        color: white;
        text-align: center;
        padding: 10px;
        margin-top: 20px;
    }

    /* Cart box */
    .cart-box {
        position: fixed;
        right: 20px;
        top: 80px;
        width: 250px;
        background: white;
        border: 2px solid #0057ff;
        border-radius: 10px;
        padding: 10px;
        display: none;
    }

    .cart-box h3 {
        margin-top: 0;
    }

</style>
</head>

<body>

<header>
    <h1>Bachat Store 🛍️</h1>
    <div class="cart" onclick="toggleCart()">
        Cart: <span id="cartCount">0</span>
    </div>
</header>

<div class="hero">
    <h2>Low Price Daily Essentials Store</h2>
    <p>Kitchen • Toys • Cosmetics • Household Items</p>
</div>

<div class="products">

    <div class="product">
        <h3>Plastic Basket</h3>
        <p>Rs 250</p>
        <button onclick="addToCart('Plastic Basket')">Add to Cart</button>
    </div>

    <div class="product">
        <h3>Kitchen Spoon Set</h3>
        <p>Rs 300</p>
        <button onclick="addToCart('Kitchen Spoon Set')">Add to Cart</button>
    </div>

    <div class="product">
        <h3>Kids Toy Car</h3>
        <p>Rs 500</p>
        <button onclick="addToCart('Kids Toy Car')">Add to Cart</button>
    </div>

    <div class="product">
        <h3>Beauty Cream</h3>
        <p>Rs 450</p>
        <button onclick="addToCart('Beauty Cream')">Add to Cart</button>
    </div>

</div>

<div class="cart-box" id="cartBox">
    <h3>Your Cart</h3>
    <ul id="cartItems"></ul>
    <button onclick="checkout()" style="background:#ffcc00;border:none;padding:8px;width:100%;cursor:pointer;">
        Checkout
    </button>
</div>

<footer>
    © 2026 Bachat Store | Affordable Shopping for Everyone
</footer>

<script>
    let cart = [];
    let count = 0;

    function addToCart(item) {
        cart.push(item);
        count++;
        document.getElementById("cartCount").innerText = count;

        let li = document.createElement("li");
        li.innerText = item;
        document.getElementById("cartItems").appendChild(li);
    }

    function toggleCart() {
        let box = document.getElementById("cartBox");
        box.style.display = box.style.display === "block" ? "none" : "block";
    }

    function checkout() {
        if(cart.length === 0) {
            alert("Cart is empty!");
        } else {
            alert("Order placed successfully 🎉");
            cart = [];
            count = 0;
            document.getElementById("cartCount").innerText = 0;
            document.getElementById("cartItems").innerHTML = "";
        }
    }
</script>

</body>
</html>
